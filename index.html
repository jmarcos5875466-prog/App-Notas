<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Preços Fácil</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .app-container {
            width: 100%;
            max-width: 1350px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        header {
            text-align: center;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        header p {
            font-size: 13px;
            font-weight: 500;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }

        .empresa-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 8px 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .empresa-card label {
            font-size: 11px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .empresa-card input {
            width: 100%;
            font-size: 13px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 5px 10px;
            color: #38bdf8;
            outline: none;
            transition: all 0.2s;
        }

        .empresa-card input:focus {
            border-color: #38bdf8;
            background: rgba(255, 255, 255, 0.08);
        }

        /* Bloco de Detalhes da Nota (Alinhado em linha) */
        .nfe-detalhes-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 8px 12px;
            margin-bottom: 10px;
            display: none; /* Só aparece ao importar XML */
            grid-template-columns: 180px 140px 1fr;
            gap: 10px;
            align-items: center;
        }

        .nfe-campo-grupo {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .nfe-campo-grupo label {
            font-size: 9px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .nfe-input-copia {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 3px 6px;
            gap: 6px;
        }

        .nfe-input-copia input {
            width: 100%;
            font-size: 11px;
            font-weight: 600;
            background: transparent;
            border: none;
            color: #e2e8f0;
            outline: none;
        }

        .btn-copiar {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-copiar:hover {
            background: rgba(56, 189, 248, 0.3);
            border-color: #38bdf8;
        }

        .btn-copiar.copiado {
            background: rgba(34, 197, 94, 0.2);
            border-color: #4ade80;
            color: #4ade80;
        }

        .config-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
            align-items: start;
        }

        .card-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 10px;
            transition: all 0.3s ease;
        }

        .card-input label {
            display: block;
            font-size: 11px;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .margin-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .margin-btn {
            flex: 1;
            min-width: 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 5px 8px;
            text-align: center;
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .margin-btn:hover { background: rgba(255, 255, 255, 0.1); }

        .margin-btn.active {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
            color: #38bdf8;
        }

        #blocoMargemCustom, #blocoStTotal, #blocoOpcoesRateio {
            display: none;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .rateio-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .rateio-item {
            flex: 1;
            min-width: 110px;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 4px 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .rateio-item.active {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
        }

        .rateio-btn-text {
            flex: 1;
            font-size: 11px;
            font-weight: 600;
            color: #cbd5e1;
            text-align: center;
        }

        .rateio-item.active .rateio-btn-text {
            color: #38bdf8;
        }

        .info-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            color: #38bdf8;
            font-size: 10px;
            font-weight: 700;
            margin-left: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .info-icon:hover {
            background: rgba(56, 189, 248, 0.3);
        }

        .grid-campos-auto {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 6px;
        }

        .campo-sub-input {
            margin-bottom: 2px;
        }

        .campo-sub-input label {
            font-size: 9px;
            margin-bottom: 2px;
            white-space: nowrap;
        }

        .campo-sub-input input {
            width: 100%;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            padding: 4px 6px;
            color: #fff;
            outline: none;
        }

        .campo-sub-input input.resultado-imposto {
            background: rgba(245, 158, 11, 0.15);
            border-color: rgba(245, 158, 11, 0.4);
            color: #f59e0b;
            font-weight: 700;
        }

        .campo-sub-input input.resultado-desconto {
            background: rgba(34, 197, 94, 0.15);
            border-color: rgba(34, 197, 94, 0.4);
            color: #4ade80;
            font-weight: 700;
        }

        .info-diferenca {
            font-size: 10px;
            padding: 4px;
            border-radius: 5px;
            margin-top: 5px;
            display: none;
        }

        .info-diferenca.imposto {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .info-diferenca.desconto {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .controls-panel {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 8px 12px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .controls-title {
            font-size: 10px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .toggles-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
        }

        .toggle-container span {
            font-size: 11px;
            font-weight: 600;
            color: #cbd5e1;
            white-space: nowrap;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 32px;
            height: 16px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .3s;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 10px;
            width: 10px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #38bdf8;
            border-color: #38bdf8;
        }

        input:checked + .slider:before {
            transform: translateX(16px);
        }

        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            gap: 8px;
        }

        .actions-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-xml {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-xml:hover {
            background: rgba(56, 189, 248, 0.25);
            border-color: #38bdf8;
            color: #7dd3fc;
        }

        .btn-fullscreen {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-fullscreen:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
            color: #38bdf8;
        }

        .btn-limpar {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-limpar:hover {
            background: rgba(239, 68, 68, 0.25);
            border-color: rgba(239, 68, 68, 0.5);
            color: #fca5a5;
        }

        .collapse-bar {
            width: 100%;
            height: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            margin: 2px 0 10px 0;
            position: relative;
        }

        .collapse-bar::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .collapse-trigger {
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            padding: 1px 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #38bdf8;
            transition: all 0.2s ease;
            z-index: 5;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .collapse-trigger:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
            color: #7dd3fc;
        }

        .collapse-trigger svg {
            transition: transform 0.3s ease;
        }

        .recolhido .collapse-trigger svg {
            transform: rotate(180deg);
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(15, 23, 42, 0.4);
            max-height: 620px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 12px;
        }

        th {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(30, 41, 59, 0.95);
            color: #cbd5e1;
            font-weight: 600;
            padding: 8px 8px;
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            white-space: nowrap;
        }

        td {
            padding: 6px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            color: #e2e8f0;
            transition: opacity 0.2s, filter 0.2s;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .input-texto, .input-custo {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 4px 8px;
            color: white;
            font-size: 12px;
            outline: none;
            transition: all 0.2s;
        }

        .input-texto { width: 220px; }
        .input-custo { width: 80px; font-weight: 600; }

        .input-texto:focus, .input-custo:focus {
            border-color: #38bdf8;
            background: rgba(255, 255, 255, 0.12);
        }

        .badge-imposto { color: #f59e0b; font-weight: 600; font-size: 12px; }
        .badge-custo-total { color: #fbbf24; font-weight: 700; }
        .badge-custo { color: #38bdf8; font-weight: 600; }
        .badge-preco { color: #4ade80; font-weight: 700; font-size: 12px; }

        /* Modal Explicativo */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-card {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 18px 20px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            color: #f8fafc;
        }

        .modal-card h4 {
            font-size: 14px;
            color: #38bdf8;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-card p {
            font-size: 12px;
            color: #cbd5e1;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .modal-exemplo {
            background: rgba(15, 23, 42, 0.6);
            border: 1px dashed rgba(56, 189, 248, 0.3);
            border-radius: 8px;
            padding: 10px;
            font-size: 11px;
            color: #e2e8f0;
            line-height: 1.5;
        }

        .modal-exemplo strong {
            color: #fbbf24;
            display: block;
            margin-bottom: 4px;
        }

        .btn-modal-close {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 16px;
            cursor: pointer;
            font-weight: 700;
        }

        .btn-modal-close:hover { color: #fff; }

        @media (max-width: 900px) {
            .nfe-detalhes-card { grid-template-columns: 1fr; }
        }

        @media (max-width: 768px) {
            .config-grid { grid-template-columns: 1fr; }
            .app-container { padding: 10px; }
            body { padding: 5px; }
            .grid-campos-auto { grid-template-columns: 1fr; }
            .actions-bar { flex-direction: column; align-items: stretch; }
            .controls-panel { flex-direction: column; align-items: flex-start; }
            .toggles-group { flex-direction: column; align-items: flex-start; width: 100%; }
            .toggle-container { width: 100%; justify-content: space-between; }
            .empresa-card { flex-direction: column; align-items: flex-start; }
            .rateio-buttons { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div id="painelControlesTopo">
        <header>
            <p>Sistema Inteligente de Custos e Impostos</p>
        </header>

        <!-- Empresa Emitente -->
        <div class="empresa-card">
            <label for="nomeEmpresa">Empresa / Fornecedor:</label>
            <input type="text" id="nomeEmpresa" placeholder="Nome da empresa emitente da nota..." autocomplete="off">
        </div>

        <!-- Detalhes da Nota Fiscal (CNPJ, Data, Chave na mesma linha) -->
        <div class="nfe-detalhes-card" id="blocoDetalhesNfe">
            <div class="nfe-campo-grupo">
                <label>CNPJ do Emitente</label>
                <div class="nfe-input-copia">
                    <input type="text" id="cnpjEmitente" readonly placeholder="00.000.000/0000-00">
                    <button class="btn-copiar" onclick="copiarTexto('cnpjEmitente', this)">Copiar</button>
                </div>
            </div>
            <div class="nfe-campo-grupo">
                <label>Data de Emissão</label>
                <div class="nfe-input-copia">
                    <input type="text" id="dataEmissao" readonly placeholder="00/00/0000">
                    <button class="btn-copiar" onclick="copiarTexto('dataEmissao', this)">Copiar</button>
                </div>
            </div>
            <div class="nfe-campo-grupo">
                <label>Chave de Acesso (NF-e)</label>
                <div class="nfe-input-copia">
                    <input type="text" id="chaveAcesso" readonly placeholder="0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000">
                    <button class="btn-copiar" onclick="copiarTexto('chaveAcesso', this)">Copiar Chave</button>
                </div>
            </div>
        </div>

        <div class="config-grid">
            <!-- Coluna da Esquerda: Resumo do Ajuste da Nota -->
            <div class="card-input">
                <label>Apuração da Nota</label>

                <!-- Bloco 1: Apenas para ICMS ST do Produto -->
                <div id="blocoStTotal">
                    <label for="totalStImposto">Valor Total dos Impostos (ICMS ST)</label>
                    <input type="text" id="totalStImposto" placeholder="0,00" readonly style="width:100%; font-size:14px; font-weight:700; background:rgba(245, 158, 11, 0.1); border:1px solid rgba(245, 158, 11, 0.3); border-radius:6px; padding:6px 10px; color:#f59e0b; margin-top: 2px;">
                    <span style="font-size: 10px; color: #94a3b8; display: block; margin-top: 4px;">* Soma automática dos valores de ICMS ST dos produtos</span>
                </div>

                <!-- Bloco 2: Para Acréscimo / Desconto (Nota x Prod) -->
                <div id="blocoImpostoValor" style="display: block;">
                    <div id="camposAutoImposto">
                        <div class="grid-campos-auto">
                            <div class="campo-sub-input">
                                <label for="valTotalNota">Total Nota (R$)</label>
                                <input type="text" id="valTotalNota" placeholder="0,00" readonly style="width:100%; font-size:12px; font-weight:600; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:5px; padding:4px 6px; color:#fff;">
                            </div>
                            <div class="campo-sub-input">
                                <label for="valTotalProdutos">Total Prod. (R$)</label>
                                <input type="text" id="valTotalProdutos" placeholder="0,00" readonly style="width:100%; font-size:12px; font-weight:600; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:5px; padding:4px 6px; color:#fff;">
                            </div>
                            <div class="campo-sub-input">
                                <label for="impostoAutoResultado" id="labelResultadoAjuste">Ajuste (R$)</label>
                                <input type="text" id="impostoAutoResultado" class="resultado-imposto" placeholder="0,00" readonly>
                            </div>
                        </div>
                        <div id="infoDiferenca" class="info-diferenca"></div>
                    </div>

                    <!-- Opções de Rateio para Acréscimo -->
                    <div id="blocoOpcoesRateio">
                        <label>Tipo de Rateio do Acréscimo:</label>
                        <div class="rateio-buttons">
                            <div class="rateio-item active" id="btnRateioProporcional" onclick="selecionarRateio('proporcional', this)">
                                <span class="rateio-btn-text">Proporcional (R$)</span>
                                <span class="info-icon" onclick="event.stopPropagation(); mostrarExplicacao('proporcional')">ⓘ</span>
                            </div>
                            <div class="rateio-item" id="btnRateioProduto" onclick="selecionarRateio('produto', this)">
                                <span class="rateio-btn-text">Igual por Produto</span>
                                <span class="info-icon" onclick="event.stopPropagation(); mostrarExplicacao('produto')">ⓘ</span>
                            </div>
                            <div class="rateio-item" id="btnRateioUnidade" onclick="selecionarRateio('unidade', this)">
                                <span class="rateio-btn-text">Igual por Unidade</span>
                                <span class="info-icon" onclick="event.stopPropagation(); mostrarExplicacao('unidade')">ⓘ</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Coluna da Direita: Margem de Venda -->
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <div class="card-input">
                    <label>Margem de Venda</label>
                    <div class="margin-buttons">
                        <div class="margin-btn" onclick="selecionarMargem('20', this)">20%</div>
                        <div class="margin-btn" onclick="selecionarMargem('35', this)">35%</div>
                        <div class="margin-btn" onclick="selecionarMargem('40', this)">40%</div>
                        <div class="margin-btn" onclick="selecionarMargem('50', this)">50%</div>
                        <div class="margin-btn" onclick="selecionarMargem('custom', this)">Outra</div>
                    </div>

                    <div id="blocoMargemCustom">
                        <label for="margemCustomInput">Margem Personalizada (%)</label>
                        <input type="number" id="margemCustomInput" placeholder="Ex: 25" step="0.1" style="width:100%; font-size:12px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:5px; padding:4px 6px; color:#fff;" oninput="atualizarCalculos()">
                    </div>
                </div>

                <!-- Painel de Exibição Padrão -->
                <div class="controls-panel" id="painelExibicaoPadrao" style="display: flex;">
                    <div class="controls-title">Personalizar Exibição:</div>
                    <div class="toggles-group">
                        <label class="toggle-container">
                            <span>Nome do Produto</span>
                            <div class="switch">
                                <input type="checkbox" id="toggleNomePadrao" checked onchange="sincronizarToggle(this)">
                                <span class="slider"></span>
                            </div>
                        </label>
                        <label class="toggle-container">
                            <span>Margem Individual</span>
                            <div class="switch">
                                <input type="checkbox" id="toggleMargemIndividualPadrao" onchange="sincronizarToggleMargem(this)">
                                <span class="slider"></span>
                            </div>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="actions-bar">
            <div class="actions-group">
                <label class="btn-xml">
                    📄 Importar XML da Nota
                    <input type="file" id="inputXml" accept=".xml" style="display: none;" onchange="importarXML(event)">
                </label>
                <button class="btn-fullscreen" onclick="toggleFullscreen()" title="Alternar Tela Cheia">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                    </svg>
                    Tela Cheia
                </button>
            </div>
            <button class="btn-limpar" onclick="limparTudo()">Limpar / Resetar</button>
        </div>
    </div>

    <!-- Barra Retratil -->
    <div class="collapse-bar" id="barraRetratil" onclick="togglePainelSuperior()" title="Ocultar / Mostrar painel superior">
        <div class="collapse-trigger">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="18 15 12 9 6 15"></polyline>
            </svg>
        </div>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr id="cabecalhoTabela"></tr>
            </thead>
            <tbody id="corpoTabela"></tbody>
        </table>
    </div>
</div>

<!-- Modal Explicativo -->
<div class="modal-overlay" id="modalExplicativo" onclick="fecharModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
        <h4>
            <span id="modalTitulo">Como funciona</span>
            <button class="btn-modal-close" onclick="fecharModal()">✕</button>
        </h4>
        <p id="modalTexto">Texto explicativo...</p>
        <div class="modal-exemplo" id="modalExemplo">
            <!-- Exemplo dinâmico -->
        </div>
    </div>
</div>

<script>
    let qtdLinhasAtivas = 0;
    let dadosProdutos = {};
    let margemSelecionada = null;
    let tipoAjusteNota = 'imposto';
    let tipoRateioAcrecimo = 'proporcional';
    let valorNotaXMLGlobal = 0;
    let valorProdutosXMLGlobal = 0;
    let diferencaNotaGlobal = 0;
    let temStNaNota = false;
    let isImporting = false;

    function formatarBR(valor) {
        const num = parseFloat(valor) || 0;
        return num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatarCNPJ(cnpj) {
        if (!cnpj) return '';
        cnpj = cnpj.replace(/\D/g, '');
        return cnpj.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, "$1.$2.$3/$4-$5");
    }

    function formatarData(dataStr) {
        if (!dataStr) return '';
        if (dataStr.includes('-')) {
            let p = dataStr.split('T')[0].split('-');
            if (p.length === 3) return `${p[2]}/${p[1]}/${p[0]}`;
        }
        return dataStr;
    }

    function copiarTexto(elementId, btnEl) {
        const input = document.getElementById(elementId);
        if (!input || !input.value) return;

        navigator.clipboard.writeText(input.value).then(() => {
            const textoOriginal = btnEl.innerText;
            btnEl.innerText = 'Copiado!';
            btnEl.classList.add('copiado');
            setTimeout(() => {
                btnEl.innerText = textoOriginal;
                btnEl.classList.remove('copiado');
            }, 2000);
        }).catch(err => {
            alert('Erro ao copiar para a área de transferência.');
        });
    }

    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                alert(`Erro ao tentar ativar a tela cheia: ${err.message}`);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    function togglePainelSuperior() {
        const painel = document.getElementById('painelControlesTopo');
        const container = document.getElementById('barraRetratil');
        if (painel.style.display === 'none') {
            painel.style.display = 'block';
            container.classList.remove('recolhido');
        } else {
            painel.style.display = 'none';
            container.classList.add('recolhido');
        }
    }

    function garantirLinhaExistente(i) {
        if (!dadosProdutos[i]) {
            dadosProdutos[i] = { nome: '', valorTotal: '', icmsST: '', qtdLote: '', margem: '' };
        }
    }

    function selecionarMargem(valor, el) {
        margemSelecionada = valor;
        document.querySelectorAll('.margin-btn').forEach(btn => btn.classList.remove('active'));
        if (el) el.classList.add('active');

        const blocoCustom = document.getElementById('blocoMargemCustom');
        blocoCustom.style.display = (valor === 'custom') ? 'block' : 'none';
        construirTabela(true);
    }

    function selecionarRateio(tipo, el) {
        tipoRateioAcrecimo = tipo;
        document.querySelectorAll('.rateio-item').forEach(btn => btn.classList.remove('active'));
        if (el) el.classList.add('active');
        atualizarCalculos();
    }

    function mostrarExplicacao(tipo) {
        const modal = document.getElementById('modalExplicativo');
        const titulo = document.getElementById('modalTitulo');
        const texto = document.getElementById('modalTexto');
        const exemplo = document.getElementById('modalExemplo');

        if (tipo === 'proporcional') {
            titulo.innerText = 'Rateio Proporcional (por Valor)';
            texto.innerText = 'O acréscimo é dividido proporcionalmente ao preço de cada produto. Quem custa mais caro na nota absorve uma parcela maior do acréscimo em reais.';
            exemplo.innerHTML = `<strong>💡 Exemplo Prático:</strong>
            Acréscimo de R$ 60,00 numa nota com 2 produtos:<br>
            • <strong>Sabão Líquido 3L:</strong> Total R$ 150,00 (75% da nota) ➔ Absorve <strong>R$ 45,00</strong><br>
            • <strong>Esponja Multiuso:</strong> Total R$ 50,00 (25% da nota) ➔ Absorve <strong>R$ 15,00</strong>`;
        } else if (tipo === 'produto') {
            titulo.innerText = 'Igual por Produto (por Linha)';
            texto.innerText = 'O acréscimo total é dividido em partes exatamente iguais entre os tipos de produtos listados, sem importar o preço ou a quantidade de caixas.';
            exemplo.innerHTML = `<strong>💡 Exemplo Prático:</strong>
            Acréscimo de R$ 60,00 dividido igualmente entre 2 produtos:<br>
            • <strong>Sabão Líquido 3L:</strong> Recebe <strong>R$ 30,00</strong> de acréscimo<br>
            • <strong>Esponja Multiuso:</strong> Recebe <strong>R$ 30,00</strong> de acréscimo`;
        } else if (tipo === 'unidade') {
            titulo.innerText = 'Igual por Unidade (por Volume)';
            texto.innerText = 'O acréscimo é dividido pela soma de todas as unidades da nota. Cada unidade (caixa ou pacote) paga exatamente a mesma quantia.';
            exemplo.innerHTML = `<strong>💡 Exemplo Prático:</strong>
            Acréscimo de R$ 60,00 em 12 unidades totais (R$ 5,00/un):<br>
            • <strong>Sabão Líquido 3L (2 un):</strong> 2 × R$ 5,00 = <strong>R$ 10,00</strong><br>
            • <strong>Esponja Multiuso (10 un):</strong> 10 × R$ 5,00 = <strong>R$ 50,00</strong>`;
        }

        modal.style.display = 'flex';
    }

    function fecharModal() {
        document.getElementById('modalExplicativo').style.display = 'none';
    }

    function calcularImpostoAuto() {
        const vNota = valorNotaXMLGlobal;
        const vProd = valorProdutosXMLGlobal;

        const infoDiv = document.getElementById('infoDiferenca');
        const impostoResultadoInput = document.getElementById('impostoAutoResultado');
        const labelResultado = document.getElementById('labelResultadoAjuste');

        const blocoSt = document.getElementById('blocoStTotal');
        const blocoValor = document.getElementById('blocoImpostoValor');
        const blocoOpcoesRateio = document.getElementById('blocoOpcoesRateio');

        if (temStNaNota) {
            blocoSt.style.display = 'block';
            blocoValor.style.display = 'none';
            blocoOpcoesRateio.style.display = 'none';
        } else {
            blocoSt.style.display = 'none';
            blocoValor.style.display = 'block';
        }

        if (vNota > 0 && vProd > 0) {
            if (vNota > vProd) {
                tipoAjusteNota = 'imposto';
                diferencaNotaGlobal = vNota - vProd;
                impostoResultadoInput.value = formatarBR(diferencaNotaGlobal);
                impostoResultadoInput.className = 'resultado-imposto';
                labelResultado.innerText = 'Acréscimo (R$)';
                infoDiv.className = 'info-diferenca imposto';
                infoDiv.style.display = 'block';
                infoDiv.innerText = `Acréscimo apurado (R$ ${formatarBR(diferencaNotaGlobal)})`;
                blocoOpcoesRateio.style.display = 'block';
            } else if (vNota < vProd) {
                tipoAjusteNota = 'desconto';
                diferencaNotaGlobal = vProd - vNota;
                impostoResultadoInput.value = formatarBR(diferencaNotaGlobal);
                impostoResultadoInput.className = 'resultado-desconto';
                labelResultado.innerText = 'Desconto (R$)';
                infoDiv.className = 'info-diferenca desconto';
                infoDiv.style.display = 'block';
                infoDiv.innerText = `Desconto na Nota (R$ ${formatarBR(diferencaNotaGlobal)})`;
                blocoOpcoesRateio.style.display = 'none';
            } else {
                tipoAjusteNota = 'imposto';
                diferencaNotaGlobal = 0;
                impostoResultadoInput.value = '0,00';
                impostoResultadoInput.className = 'resultado-imposto';
                labelResultado.innerText = 'Ajuste (R$)';
                infoDiv.className = 'info-diferenca';
                infoDiv.style.display = 'block';
                infoDiv.innerText = `Nota sem diferenças (Valores iguais)`;
                blocoOpcoesRateio.style.display = 'none';
            }
        } else {
            infoDiv.style.display = 'none';
            impostoResultadoInput.value = '';
            impostoResultadoInput.className = 'resultado-imposto';
            diferencaNotaGlobal = 0;
            blocoOpcoesRateio.style.display = 'none';
        }

        construirTabela(false);
    }

    function sincronizarToggle(el) {
        const estado = el.checked;
        document.getElementById('toggleNomePadrao').checked = estado;
        construirTabela(true);
    }

    function sincronizarToggleMargem(el) {
        const estado = el.checked;
        document.getElementById('toggleMargemIndividualPadrao').checked = estado;
        construirTabela(true);
    }

    function salvarDadosNaMemoria() {
        if (isImporting) return;
        for (let i = 1; i <= qtdLinhasAtivas; i++) {
            garantirLinhaExistente(i);
            let elNome = document.getElementById(`nome_${i}`);
            let elTotal = document.getElementById(`total_${i}`);
            let elIcmsST = document.getElementById(`icmsST_${i}`);
            let elQtdLote = document.getElementById(`qtdLote_${i}`);
            let elMargemItem = document.getElementById(`margemItem_${i}`);

            if (elNome) dadosProdutos[i].nome = elNome.value;
            if (elTotal) dadosProdutos[i].valorTotal = elTotal.value;
            if (elIcmsST) dadosProdutos[i].icmsST = elIcmsST.value;
            if (elQtdLote) dadosProdutos[i].qtdLote = elQtdLote.value;
            if (elMargemItem) dadosProdutos[i].margem = elMargemItem.value;
        }
    }

    function getTagText(element, tagName) {
        if (!element) return '';
        let list = element.getElementsByTagNameNS("*", tagName);
        if (!list || list.length === 0) {
            list = element.getElementsByTagName(tagName);
        }
        return (list && list.length > 0) ? list[0].textContent.trim() : '';
    }

    function extrairTagRegex(xmlStr, tagName) {
        const regex = new RegExp(`<([a-zA-Z0-9_]+:)?${tagName}[^>]*>([\\s\\S]*?)<\\/([a-zA-Z0-9_]+:)?${tagName}>`, 'i');
        const match = xmlStr.match(regex);
        return match ? match[2].trim() : '';
    }

    function extrairChaveAcesso(xmlStr, xmlDoc) {
        let infNFe = xmlDoc.getElementsByTagNameNS("*", "infNFe");
        if (!infNFe || infNFe.length === 0) infNFe = xmlDoc.getElementsByTagName("infNFe");
        if (infNFe && infNFe.length > 0) {
            let idAttr = infNFe[0].getAttribute("Id");
            if (idAttr) {
                return idAttr.replace(/\D/g, '');
            }
        }
        const match = xmlStr.match(/infNFe[^\>]*Id="NFe(\d{44})"/i);
        if (match) return match[1];

        const matchChave = xmlStr.match(/<chNFe>(\d{44})<\/chNFe>/i);
        if (matchChave) return matchChave[1];

        return '';
    }

    function importarXML(event) {
        const file = event.target.files[0];
        if (!file) return;

        isImporting = true;

        dadosProdutos = {}; 
        qtdLinhasAtivas = 0;
        valorNotaXMLGlobal = 0;
        valorProdutosXMLGlobal = 0;
        diferencaNotaGlobal = 0;
        temStNaNota = false;

        document.getElementById('corpoTabela').innerHTML = '';
        document.getElementById('nomeEmpresa').value = '';
        document.getElementById('cnpjEmitente').value = '';
        document.getElementById('dataEmissao').value = '';
        document.getElementById('chaveAcesso').value = '';
        document.getElementById('blocoDetalhesNfe').style.display = 'none';
        document.getElementById('valTotalNota').value = '';
        document.getElementById('valTotalProdutos').value = '';
        document.getElementById('impostoAutoResultado').value = '';
        document.getElementById('totalStImposto').value = '';

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const xmlText = e.target.result;
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "text/xml");

                let nomeEmpresa = '';
                let cnpjEmpresa = '';
                let dataEmissao = '';

                // Emitente
                let emitenteNode = xmlDoc.getElementsByTagNameNS("*", "emit");
                if (!emitenteNode || emitenteNode.length === 0) emitenteNode = xmlDoc.getElementsByTagName("emit");

                if (emitenteNode && emitenteNode.length > 0) {
                    nomeEmpresa = getTagText(emitenteNode[0], "xNome") || getTagText(emitenteNode[0], "xFant");
                    cnpjEmpresa = getTagText(emitenteNode[0], "CNPJ") || getTagText(emitenteNode[0], "CPF");
                }

                if (!nomeEmpresa) nomeEmpresa = extrairTagRegex(xmlText, "xNome") || extrairTagRegex(xmlText, "xFant");
                if (!cnpjEmpresa) cnpjEmpresa = extrairTagRegex(xmlText, "CNPJ");

                // Ide (Data de Emissão)
                let ideNode = xmlDoc.getElementsByTagNameNS("*", "ide");
                if (!ideNode || ideNode.length === 0) ideNode = xmlDoc.getElementsByTagName("ide");

                if (ideNode && ideNode.length > 0) {
                    dataEmissao = getTagText(ideNode[0], "dhEmi") || getTagText(ideNode[0], "dEmi");
                }
                if (!dataEmissao) dataEmissao = extrairTagRegex(xmlText, "dhEmi") || extrairTagRegex(xmlText, "dEmi");

                // Chave de Acesso
                let chaveNFe = extrairChaveAcesso(xmlText, xmlDoc);

                document.getElementById('nomeEmpresa').value = nomeEmpresa;
                
                if (cnpjEmpresa || dataEmissao || chaveNFe) {
                    document.getElementById('cnpjEmitente').value = formatarCNPJ(cnpjEmpresa);
                    document.getElementById('dataEmissao').value = formatarData(dataEmissao);
                    document.getElementById('chaveAcesso').value = chaveNFe;
                    document.getElementById('blocoDetalhesNfe').style.display = 'grid';
                }

                let icmsTotList = xmlDoc.getElementsByTagNameNS("*", "ICMSTot");
                if (!icmsTotList || icmsTotList.length === 0) icmsTotList = xmlDoc.getElementsByTagName("ICMSTot");
                let totalNode = icmsTotList.length > 0 ? icmsTotList[0] : xmlDoc;

                let vNFVal = getTagText(totalNode, "vNF") || extrairTagRegex(xmlText, "vNF");
                let vProdVal = getTagText(totalNode, "vProd") || extrairTagRegex(xmlText, "vProd");

                valorNotaXMLGlobal = parseFloat(vNFVal) || 0;
                valorProdutosXMLGlobal = parseFloat(vProdVal) || 0;

                document.getElementById('valTotalNota').value = valorNotaXMLGlobal ? formatarBR(valorNotaXMLGlobal) : '';
                document.getElementById('valTotalProdutos').value = valorProdutosXMLGlobal ? formatarBR(valorProdutosXMLGlobal) : '';

                let listaProdutos = [];
                let itensDOM = xmlDoc.getElementsByTagNameNS("*", "det");
                if (!itensDOM || itensDOM.length === 0) itensDOM = xmlDoc.getElementsByTagName("det");

                if (itensDOM && itensDOM.length > 0) {
                    Array.from(itensDOM).forEach(item => {
                        let prodList = item.getElementsByTagNameNS("*", "prod");
                        let prodNode = prodList.length > 0 ? prodList[0] : item;

                        let xProd = getTagText(prodNode, "xProd");
                        let vProdItem = getTagText(prodNode, "vProd");
                        let qCom = getTagText(prodNode, "qCom") || "1";
                        let vICMSST = getTagText(item, "vICMSST");

                        if (xProd) {
                            listaProdutos.push({
                                nome: xProd,
                                valorTotal: vProdItem ? parseFloat(vProdItem).toFixed(2) : '0.00',
                                icmsST: vICMSST ? parseFloat(vICMSST).toFixed(2) : '0.00',
                                qtdLote: qCom ? parseFloat(qCom).toString() : '1'
                            });
                        }
                    });
                }

                if (listaProdutos.length === 0) {
                    const detBlocks = xmlText.match(/<([a-zA-Z0-9_]+:)?det[\s\S]*?<\/([a-zA-Z0-9_]+:)?det>/gi);
                    if (detBlocks) {
                        detBlocks.forEach(block => {
                            let xProd = extrairTagRegex(block, "xProd");
                            let vProdItem = extrairTagRegex(block, "vProd");
                            let qCom = extrairTagRegex(block, "qCom") || "1";
                            let vICMSST = extrairTagRegex(block, "vICMSST");

                            if (xProd) {
                                listaProdutos.push({
                                    nome: xProd,
                                    valorTotal: vProdItem ? parseFloat(vProdItem).toFixed(2) : '0.00',
                                    icmsST: vICMSST ? parseFloat(vICMSST).toFixed(2) : '0.00',
                                    qtdLote: qCom ? parseFloat(qCom).toString() : '1'
                                });
                            }
                        });
                    }
                }

                if (listaProdutos.length === 0) {
                    alert("Nenhum produto foi localizado no arquivo XML!");
                    isImporting = false;
                    return;
                }

                qtdLinhasAtivas = listaProdutos.length;

                listaProdutos.forEach((prod, index) => {
                    const i = index + 1;
                    dadosProdutos[i] = {
                        nome: prod.nome,
                        valorTotal: prod.valorTotal,
                        icmsST: prod.icmsST,
                        qtdLote: prod.qtdLote,
                        margem: ''
                    };

                    if (parseFloat(prod.icmsST) > 0) {
                        temStNaNota = true;
                    }
                });

                calcularImpostoAuto();

            } catch (err) {
                alert("Erro ao ler a NF-e. Verifique se é um arquivo XML válido.");
                console.error(err);
            } finally {
                isImporting = false;
            }
        };

        reader.readAsText(file);
        event.target.value = '';
    }

    function limparTudo() {
        isImporting = true;
        qtdLinhasAtivas = 0;
        tipoAjusteNota = 'imposto';
        valorNotaXMLGlobal = 0;
        valorProdutosXMLGlobal = 0;
        diferencaNotaGlobal = 0;
        temStNaNota = false;
        
        document.getElementById('nomeEmpresa').value = '';
        document.getElementById('cnpjEmitente').value = '';
        document.getElementById('dataEmissao').value = '';
        document.getElementById('chaveAcesso').value = '';
        document.getElementById('blocoDetalhesNfe').style.display = 'none';
        document.getElementById('toggleNomePadrao').checked = true;
        document.getElementById('toggleMargemIndividualPadrao').checked = false;
        document.getElementById('margemCustomInput').value = '';
        document.getElementById('valTotalNota').value = '';
        document.getElementById('valTotalProdutos').value = '';
        document.getElementById('impostoAutoResultado').value = '';
        document.getElementById('totalStImposto').value = '';
        document.getElementById('blocoOpcoesRateio').style.display = 'none';

        dadosProdutos = {};

        margemSelecionada = null;
        document.querySelectorAll('.margin-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('blocoMargemCustom').style.display = 'none';

        calcularImpostoAuto();
        isImporting = false;
    }

    function construirTabela(deveSalvarDOM = true) {
        if (deveSalvarDOM && !isImporting) {
            salvarDadosNaMemoria();
        }

        const mostrarNome = document.getElementById('toggleNomePadrao').checked;
        const margemIndividual = document.getElementById('toggleMargemIndividualPadrao').checked;
        const mostrarColunaAcrecimo = (!temStNaNota && tipoAjusteNota === 'imposto' && diferencaNotaGlobal > 0);

        let thHTML = '';
        if (mostrarNome) thHTML += `<th>Nome do Produto</th>`;
        thHTML += `<th>Valor Total</th>`;
        
        if (temStNaNota) {
            thHTML += `<th>ICMS ST</th>`;
        } else if (mostrarColunaAcrecimo) {
            thHTML += `<th>Acréscimo</th>`;
        }

        thHTML += `<th>Custo Total</th>`;
        thHTML += `<th>Quantidade</th>`;
        thHTML += `<th>Custo Unitário</th>`;
        if (margemIndividual) thHTML += `<th>Margem (%)</th>`;
        thHTML += `<th>Preço de Venda</th>`;

        document.getElementById('cabecalhoTabela').innerHTML = thHTML;

        const tbody = document.getElementById('corpoTabela');
        tbody.innerHTML = '';

        let linhasHTML = '';

        for (let i = 1; i <= qtdLinhasAtivas; i++) {
            garantirLinhaExistente(i);
            let item = dadosProdutos[i];

            let valNome = item.nome || '';
            let valTotal = item.valorTotal || '';
            let valIcmsST = item.icmsST || '';
            let valQtd = item.qtdLote || '';
            let valMargemItem = item.margem || '';

            linhasHTML += `<tr>`;
            
            if (mostrarNome) {
                linhasHTML += `<td><input type="text" id="nome_${i}" class="input-texto" value="${valNome.replace(/"/g, '&quot;')}" placeholder="Ex: Produto" oninput="salvarDadosNaMemoria()"></td>`;
            }
            linhasHTML += `<td><input type="number" id="total_${i}" class="input-custo" value="${valTotal}" placeholder="0,00" step="0.01" oninput="atualizarCalculos()"></td>`;
            
            if (temStNaNota) {
                linhasHTML += `<td><input type="number" id="icmsST_${i}" class="input-custo" value="${valIcmsST}" placeholder="0,00" step="0.01" oninput="atualizarCalculos()"></td>`;
            } else if (mostrarColunaAcrecimo) {
                linhasHTML += `<td id="parcelaAjuste_${i}" class="badge-imposto">R$ 0,00</td>`;
            }

            linhasHTML += `<td id="custoTotalComImposto_${i}" class="badge-custo-total">R$ 0,00</td>`;
            linhasHTML += `<td><input type="number" id="qtdLote_${i}" class="input-custo" value="${valQtd}" placeholder="1" oninput="atualizarCalculos()"></td>`;
            linhasHTML += `<td id="custoFinal_${i}" class="badge-custo">R$ 0,00</td>`;
            
            if (margemIndividual) {
                linhasHTML += `<td><input type="number" id="margemItem_${i}" class="input-custo" value="${valMargemItem}" placeholder="Ex: 30" step="0.1" oninput="atualizarCalculos()"></td>`;
            }

            linhasHTML += `<td id="precoSel_${i}" class="badge-preco">R$ 0,00</td>`;
            linhasHTML += `</tr>`;
        }

        tbody.innerHTML = linhasHTML;
        atualizarCalculos();
    }

    function atualizarCalculos() {
        if (!isImporting) {
            salvarDadosNaMemoria();
        }

        const margemIndividual = document.getElementById('toggleMargemIndividualPadrao').checked;
        const mostrarColunaAcrecimo = (!temStNaNota && tipoAjusteNota === 'imposto' && diferencaNotaGlobal > 0);

        let somaStGlobal = 0;
        let somaProdutosAtual = 0;
        let somaQtdTotalGlobal = 0;

        for (let i = 1; i <= qtdLinhasAtivas; i++) {
            somaStGlobal += parseFloat(dadosProdutos[i]?.icmsST) || 0;
            somaProdutosAtual += parseFloat(dadosProdutos[i]?.valorTotal) || 0;
            let q = parseFloat(dadosProdutos[i]?.qtdLote) || 1;
            somaQtdTotalGlobal += q > 0 ? q : 1;
        }

        if (temStNaNota) {
            document.getElementById('totalStImposto').value = formatarBR(somaStGlobal);
        }

        for (let i = 1; i <= qtdLinhasAtivas; i++) {
            garantirLinhaExistente(i);
            let item = dadosProdutos[i];

            let elParcelaAjuste = document.getElementById(`parcelaAjuste_${i}`);
            let elCustoTotalComImposto = document.getElementById(`custoTotalComImposto_${i}`);
            let elCustoFinal = document.getElementById(`custoFinal_${i}`);
            let elPrecoSel = document.getElementById(`precoSel_${i}`);

            let vTotalCaixa = parseFloat(item.valorTotal) || 0;
            let qLote = parseFloat(item.qtdLote) || 1;
            if (qLote <= 0) qLote = 1;

            let alteracaoLinha = 0;
            if (mostrarColunaAcrecimo && diferencaNotaGlobal > 0) {
                if (tipoRateioAcrecimo === 'proporcional') {
                    const proporcao = somaProdutosAtual > 0 ? (vTotalCaixa / somaProdutosAtual) : 0;
                    alteracaoLinha = diferencaNotaGlobal * proporcao;
                } else if (tipoRateioAcrecimo === 'produto') {
                    alteracaoLinha = diferencaNotaGlobal / qtdLinhasAtivas;
                } else if (tipoRateioAcrecimo === 'unidade') {
                    const valorPorUnidade = somaQtdTotalGlobal > 0 ? (diferencaNotaGlobal / somaQtdTotalGlobal) : 0;
                    alteracaoLinha = valorPorUnidade * qLote;
                }
                if (elParcelaAjuste) elParcelaAjuste.innerText = `R$ ${formatarBR(alteracaoLinha)}`;
            }

            let custoTotalLinha = vTotalCaixa;
            if (temStNaNota) {
                custoTotalLinha += (parseFloat(item.icmsST) || 0);
            } else if (mostrarColunaAcrecimo) {
                custoTotalLinha += alteracaoLinha;
            }

            let custoUnitarioFinal = custoTotalLinha / qLote;

            if (elCustoTotalComImposto) elCustoTotalComImposto.innerText = `R$ ${formatarBR(custoTotalLinha)}`;
            if (elCustoFinal) elCustoFinal.innerText = `R$ ${formatarBR(custoUnitarioFinal)}`;

            let pct = 0;
            if (margemIndividual && item.margem !== '') {
                pct = parseFloat(item.margem) || 0;
            } else {
                if (margemSelecionada === 'custom') {
                    pct = parseFloat(document.getElementById('margemCustomInput').value) || 0;
                } else if (margemSelecionada !== null) {
                    pct = parseFloat(margemSelecionada) || 0;
                }
            }

            let precoVenda = custoUnitarioFinal * (1 + (pct / 100));
            if (elPrecoSel) elPrecoSel.innerText = `R$ ${formatarBR(precoVenda)}`;
        }
    }

    window.onload = () => construirTabela(false);
</script>
