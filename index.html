<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Preços Fácil</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 1350px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(90deg, #38bdf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        header p {
            font-size: 13px;
            color: #94a3b8;
        }

        .empresa-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .empresa-card label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .empresa-card input {
            width: 100%;
            font-size: 15px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 12px;
            color: #38bdf8;
            outline: none;
            transition: all 0.2s;
        }

        .empresa-card input:focus {
            border-color: #38bdf8;
            background: rgba(255, 255, 255, 0.08);
        }

        .config-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
            align-items: start;
        }

        .card-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 15px;
            transition: all 0.3s ease;
        }

        .card-input label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .margin-buttons {
            display: flex;
            gap: 8px;
            margin-top: 5px;
            flex-wrap: wrap;
        }

        .margin-btn {
            flex: 1;
            min-width: 50px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px 10px;
            text-align: center;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .margin-btn:hover { background: rgba(255, 255, 255, 0.1); }

        .margin-btn.active {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
            color: #38bdf8;
        }

        #blocoMargemCustom {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .bloco-aviso-despesas {
            display: none;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 10px;
            padding: 12px;
            margin-top: 5px;
        }

        .bloco-aviso-despesas label {
            color: #f59e0b !important;
            margin-bottom: 4px !important;
        }

        .aviso-texto-diferenca {
            font-size: 11px;
            color: #fbbf24;
            display: block;
            margin-top: 6px;
            line-height: 1.4;
        }

        .controls-panel {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 10px;
        }

        .controls-title {
            font-size: 12px;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
        }

        .toggle-container span {
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .3s;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 12px;
            width: 12px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #38bdf8;
            border-color: #38bdf8;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .btn-xml {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-xml:hover {
            background: rgba(56, 189, 248, 0.25);
            border-color: #38bdf8;
            color: #7dd3fc;
        }

        .btn-limpar {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-limpar:hover {
            background: rgba(239, 68, 68, 0.25);
            border-color: rgba(239, 68, 68, 0.5);
            color: #fca5a5;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(15, 23, 42, 0.4);
            max-height: 600px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
        }

        th {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(30, 41, 59, 0.95);
            color: #cbd5e1;
            font-weight: 600;
            padding: 12px 10px;
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            white-space: nowrap;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            color: #e2e8f0;
            transition: opacity 0.2s, filter 0.2s;
        }

        tr.linha-inativa td {
            opacity: 0.35;
            filter: grayscale(100%);
            pointer-events: none;
        }

        tr.linha-inativa td.coluna-selecao {
            opacity: 1;
            filter: none;
            pointer-events: auto;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .coluna-selecao {
            text-align: center;
            cursor: pointer;
            width: 40px;
        }

        .checkbox-linha {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #38bdf8;
        }

        .input-texto, .input-custo {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 6px 10px;
            color: white;
            font-size: 13px;
            outline: none;
            transition: all 0.2s;
        }

        .input-texto { width: 180px; }
        .input-custo { width: 90px; font-weight: 600; }

        .input-texto:focus, .input-custo:focus {
            border-color: #38bdf8;
            background: rgba(255, 255, 255, 0.12);
        }

        .badge-despesa { color: #f59e0b; font-weight: 600; font-size: 13px; }
        .badge-custo-total { color: #fbbf24; font-weight: 700; }
        .badge-custo { color: #38bdf8; font-weight: 600; }
        .badge-preco { color: #4ade80; font-weight: 700; font-size: 13px; }

        @media (max-width: 768px) {
            .config-grid { grid-template-columns: 1fr; }
            .app-container { padding: 15px; }
            body { padding: 10px; }
            .actions-bar { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Calculadora de Preços Fácil</h1>
        <p>Sistema Inteligente de Custos e Impostos</p>
    </header>

    <!-- Empresa Emitente -->
    <div class="empresa-card">
        <label for="nomeEmpresa">Empresa / Fornecedor</label>
        <input type="text" id="nomeEmpresa" placeholder="Nome da empresa emitente da nota..." autocomplete="off">
    </div>

    <div class="config-grid">
        <!-- Coluna da Esquerda: Painel Dinâmico (ST vs Outras Despesas) -->
        <div class="card-input">
            <div id="blocoImpostoTotal">
                <label for="totalImposto">Valor Total dos Impostos (ICMS ST)</label>
                <input type="number" id="totalImposto" placeholder="0,00" step="0.01" readonly style="width:100%; font-size:16px; font-weight:700; background:rgba(245, 158, 11, 0.1); border:1px solid rgba(245, 158, 11, 0.3); border-radius:8px; padding:10px 12px; color:#f59e0b; margin-top: 5px;">
                <span style="font-size: 11px; color: #94a3b8; display: block; margin-top: 6px;">* Soma automática dos valores de ICMS ST dos produtos</span>
            </div>

            <!-- Bloco Condicional para Outras Despesas / Encargos -->
            <div id="blocoOutrasDespesas" class="bloco-aviso-despesas">
                <label for="outrasDespesasInput">Outras Despesas / Encargos (R$)</label>
                <input type="number" id="outrasDespesasInput" placeholder="0,00" step="0.01" style="width:100%; font-size:14px; font-weight:600; background:rgba(255, 255, 255, 0.05); border:1px solid rgba(245, 158, 11, 0.4); border-radius:6px; padding:8px 10px; color:#f59e0b;" oninput="atualizarCalculos()">
                <span id="textoAvisoDiferenca" class="aviso-texto-diferenca"></span>
            </div>
        </div>

        <!-- Coluna da Direita: Margem + Painel de Exibição -->
        <div style="display: flex; flex-direction: column; gap: 15px;">
            <div class="card-input">
                <label>Margem de Venda</label>
                <div class="margin-buttons">
                    <div class="margin-btn" onclick="selecionarMargem('20', this)">20%</div>
                    <div class="margin-btn" onclick="selecionarMargem('35', this)">35%</div>
                    <div class="margin-btn" onclick="selecionarMargem('40', this)">40%</div>
                    <div class="margin-btn" onclick="selecionarMargem('50', this)">50%</div>
                    <div class="margin-btn" onclick="selecionarMargem('custom', this)">Outra</div>
                </div>

                <div id="blocoMargemCustom">
                    <label for="margemCustomInput">Margem Personalizada (%)</label>
                    <input type="number" id="margemCustomInput" placeholder="Ex: 25" step="0.1" style="width:100%; font-size:14px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:6px; padding:6px 8px; color:#fff;" oninput="atualizarCalculos()">
                </div>
            </div>

            <div class="controls-panel">
                <div class="controls-title">Personalizar Exibição</div>
                <label class="toggle-container">
                    <span>Nome do Produto</span>
                    <div class="switch">
                        <input type="checkbox" id="toggleNome" checked onchange="construirTabela(true)">
                        <span class="slider"></span>
                    </div>
                </label>
                <label class="toggle-container">
                    <span>Margem Individual por Produto</span>
                    <div class="switch">
                        <input type="checkbox" id="toggleMargemIndividual" onchange="construirTabela(true)">
                        <span class="slider"></span>
                    </div>
                </label>
            </div>
        </div>
    </div>

    <div class="actions-bar">
        <label class="btn-xml">
            📄 Importar XML da Nota
            <input type="file" id="inputXml" accept=".xml" style="display: none;" onchange="importarXML(event)">
        </label>
        <button class="btn-limpar" onclick="limparTudo()">Limpar / Resetar</button>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr id="cabecalhoTabela"></tr>
            </thead>
            <tbody id="corpoTabela"></tbody>
        </table>
    </div>
</div>

<script>
    let MAX_LINHAS = 25;
    let qtdLinhasAtivas = 0;
    let dadosProdutos = {};
    let margemSelecionada = null;
    let valorTotalNotaXML = 0;

    function formatarBR(valor) {
        const num = parseFloat(valor) || 0;
        return num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function garantirLinhaExistente(i) {
        if (!dadosProdutos[i]) {
            dadosProdutos[i] = { nome: '', valorTotal: '', icmsST: '', qtdLote: '', margem: '' };
        }
    }

    function selecionarMargem(valor, el) {
        margemSelecionada = valor;
        document.querySelectorAll('.margin-btn').forEach(btn => btn.classList.remove('active'));
        if (el) el.classList.add('active');

        const blocoCustom = document.getElementById('blocoMargemCustom');
        blocoCustom.style.display = (valor === 'custom') ? 'block' : 'none';
        construirTabela(true);
    }

    function selecionarAtendimentoLinhas(linhaAlvo) {
        if (qtdLinhasAtivas === linhaAlvo) {
            qtdLinhasAtivas = linhaAlvo - 1;
        } else {
            qtdLinhasAtivas = linhaAlvo;
        }
        construirTabela(true);
    }

    function salvarDadosNaMemoria() {
        for (let i = 1; i <= MAX_LINHAS; i++) {
            garantirLinhaExistente(i);
            let elNome = document.getElementById(`nome_${i}`);
            let elTotal = document.getElementById(`total_${i}`);
            let elIcmsST = document.getElementById(`icmsST_${i}`);
            let elQtdLote = document.getElementById(`qtdLote_${i}`);
            let elMargemItem = document.getElementById(`margemItem_${i}`);

            if (elNome) dadosProdutos[i].nome = elNome.value;
            if (elTotal) dadosProdutos[i].valorTotal = elTotal.value;
            if (elIcmsST) dadosProdutos[i].icmsST = elIcmsST.value;
            if (elQtdLote) dadosProdutos[i].qtdLote = elQtdLote.value;
            if (elMargemItem) dadosProdutos[i].margem = elMargemItem.value;
        }
    }

    function getTagText(element, tagName) {
        if (!element) return '';
        let list = element.getElementsByTagNameNS("*", tagName);
        if (!list || list.length === 0) {
            list = element.getElementsByTagName(tagName);
        }
        return (list && list.length > 0) ? list[0].textContent.trim() : '';
    }

    function importarXML(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(e.target.result, "text/xml");

                let emitenteNode = xmlDoc.getElementsByTagNameNS("*", "emit");
                if (!emitenteNode || emitenteNode.length === 0) {
                    emitenteNode = xmlDoc.getElementsByTagName("emit");
                }

                let nomeEmpresa = '';
                if (emitenteNode && emitenteNode.length > 0) {
                    nomeEmpresa = getTagText(emitenteNode[0], "xNome") || getTagText(emitenteNode[0], "xFant");
                }
                document.getElementById('nomeEmpresa').value = nomeEmpresa;

                const icmsTotList = xmlDoc.getElementsByTagNameNS("*", "ICMSTot");
                const totalNode = icmsTotList.length > 0 ? icmsTotList[0] : xmlDoc;
                valorTotalNotaXML = parseFloat(getTagText(totalNode, "vNF")) || 0;

                let itens = xmlDoc.getElementsByTagNameNS("*", "det");
                if (!itens || itens.length === 0) {
                    itens = xmlDoc.getElementsByTagName("det");
                }

                if (itens.length === 0) {
                    alert("Nenhum produto encontrado no XML!");
                    return;
                }

                if (itens.length > MAX_LINHAS) {
                    MAX_LINHAS = itens.length;
                }

                qtdLinhasAtivas = itens.length;
                dadosProdutos = {}; 

                Array.from(itens).forEach((item, index) => {
                    const i = index + 1;
                    garantirLinhaExistente(i);

                    const prodList = item.getElementsByTagNameNS("*", "prod");
                    const prodNode = prodList.length > 0 ? prodList[0] : item;

                    const xProd = getTagText(prodNode, "xProd");
                    const vProdItem = getTagText(prodNode, "vProd");
                    const qCom = getTagText(prodNode, "qCom") || "1";
                    const vICMSST = getTagText(item, "vICMSST");

                    dadosProdutos[i].nome = xProd;
                    dadosProdutos[i].valorTotal = vProdItem ? parseFloat(vProdItem).toFixed(2) : '';
                    dadosProdutos[i].icmsST = vICMSST ? parseFloat(vICMSST).toFixed(2) : '';
                    dadosProdutos[i].qtdLote = qCom ? parseFloat(qCom).toString() : '1';
                });

                construirTabela(false);

            } catch (err) {
                alert("Erro ao ler o arquivo XML. Certifique-se de que é uma NF-e válida.");
                console.error(err);
            }
        };

        reader.readAsText(file);
        event.target.value = '';
    }

    function limparTudo() {
        MAX_LINHAS = 25;
        qtdLinhasAtivas = 0;
        valorTotalNotaXML = 0;
        document.getElementById('nomeEmpresa').value = '';
        document.getElementById('toggleNome').checked = true;
        document.getElementById('toggleMargemIndividual').checked = false;
        document.getElementById('margemCustomInput').value = '';
        document.getElementById('totalImposto').value = '';
        document.getElementById('outrasDespesasInput').value = '';

        dadosProdutos = {};

        margemSelecionada = null;
        document.querySelectorAll('.margin-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('blocoMargemCustom').style.display = 'none';

        construirTabela(false);
    }

    function temStAtivo() {
        for (let i = 1; i <= qtdLinhasAtivas; i++) {
            let st = parseFloat(dadosProdutos[i]?.icmsST) || 0;
            if (st > 0) return true;
        }
        return false;
    }

    function construirTabela(deveSalvarDOM = true) {
        if (deveSalvarDOM) {
            salvarDadosNaMemoria();
        }

        const mostrarNome = document.getElementById('toggleNome').checked;
        const margemIndividual = document.getElementById('toggleMargemIndividual').checked;
        const existeSt = temStAtivo();

        let thHTML = `<th style="width: 40px; text-align: center;">Ativo</th><th>Nº</th>`;
        if (mostrarNome) thHTML += `<th>Nome do Produto</th>`;
        thHTML += `<th>Valor Total</th>`;
        
        if (existeSt) {
            thHTML += `<th>ICMS ST</th>`;
        } else {
            thHTML += `<th>Outras Despesas</th>`;
        }

        thHTML += `<th>Custo Total c/ Imp.</th>`;
        thHTML += `<th>Quantidade</th>`;
        thHTML += `<th>Custo Unitário</th>`;
        if (margemIndividual) thHTML += `<th>Margem (%)</th>`;
        thHTML += `<th>Preço de Venda</th>`;

        document.getElementById('cabecalhoTabela').innerHTML = thHTML;

        const tbody = document.getElementById('corpoTabela');
        tbody.innerHTML = '';

        let linhasHTML = '';

        for (let i = 1; i <= MAX_LINHAS; i++) {
            garantirLinhaExistente(i);
            let item = dadosProdutos[i];
            let estaAtiva = i <= qtdLinhasAtivas;
            let classeLinha = estaAtiva ? '' : 'class="linha-inativa"';
            let checkboxChecked = estaAtiva ? 'checked' : '';

            let valNome = item.nome || '';
            let valTotal = item.valorTotal || '';
            let valIcmsST = item.icmsST || '';
            let valQtd = item.qtdLote || '';
            let valMargemItem = item.margem || '';

            linhasHTML += `<tr ${classeLinha}>`;
            linhasHTML += `<td class="coluna-selecao" onclick="selecionarAtendimentoLinhas(${i})">
                             <input type="checkbox" class="checkbox-linha" ${checkboxChecked} onclick="event.stopPropagation(); selecionarAtendimentoLinhas(${i});">
                           </td>`;
            linhasHTML += `<td class="product-name">Prod. ${i}</td>`;
            
            if (mostrarNome) {
                linhasHTML += `<td><input type="text" id="nome_${i}" class="input-texto" value="${valNome.replace(/"/g, '&quot;')}" placeholder="Ex: Bombom" oninput="salvarDadosNaMemoria()" ${!estaAtiva ? 'tabindex="-1"' : ''}></td>`;
            }
            linhasHTML += `<td><input type="number" id="total_${i}" class="input-custo" value="${valTotal}" placeholder="0,00" step="0.01" oninput="atualizarCalculos()" ${!estaAtiva ? 'tabindex="-1"' : ''}></td>`;
            
            if (existeSt) {
                linhasHTML += `<td><input type="number" id="icmsST_${i}" class="input-custo" value="${valIcmsST}" placeholder="0,00" step="0.01" oninput="atualizarCalculos()" ${!estaAtiva ? 'tabindex="-1"' : ''}></td>`;
            } else {
                linhasHTML += `<td id="parcelaDespesa_${i}" class="badge-despesa">0,00</td>`;
            }

            linhasHTML += `<td id="custoTotalComImposto_${i}" class="badge-custo-total">R$ 0,00</td>`;
            linhasHTML += `<td><input type="number" id="qtdLote_${i}" class="input-custo" value="${valQtd}" placeholder="1" oninput="atualizarCalculos()" ${!estaAtiva ? 'tabindex="-1"' : ''}></td>`;
            linhasHTML += `<td id="custoFinal_${i}" class="badge-custo">R$ 0,00</td>`;
            
            if (margemIndividual) {
                linhasHTML += `<td><input type="number" id="margemItem_${i}" class="input-custo" value="${valMargemItem}" placeholder="Ex: 30" step="0.1" oninput="atualizarCalculos()" ${!estaAtiva ? 'tabindex="-1"' : ''}></td>`;
            }

            linhasHTML += `<td id="precoSel_${i}" class="badge-preco">R$ 0,00</td>`;
            linhasHTML += `</tr>`;
        }

        tbody.innerHTML = linhasHTML;
        atualizarCalculos();
    }

    function atualizarCalculos() {
        salvarDadosNaMemoria();

        const margemIndividual = document.getElementById('toggleMargemIndividual').checked;
        
        let somaIcmsStTotal = 0;
        let somaProdutosTotal = 0;

        for (let i = 1; i <= MAX_LINHAS; i++) {
            if (i <= qtdLinhasAtivas) {
                let item = dadosProdutos[i];
                somaIcmsStTotal += parseFloat(item.icmsST) || 0;
                somaProdutosTotal += parseFloat(item.valorTotal) || 0;
            }
        }

        const blocoSt = document.getElementById('blocoImpostoTotal');
        const blocoDespesas = document.getElementById('blocoOutrasDespesas');
        const inputDespesas = document.getElementById('outrasDespesasInput');
        const textoAviso = document.getElementById('textoAvisoDiferenca');

        let despesasValor = 0;
        let existeSt = somaIcmsStTotal > 0;

        // Se o estado visual do ST mudou em relação à tabela, reconstrói para trocar a coluna
        let thStAtual = document.querySelector('th:nth-child(4)').innerText;
        let deveRecriarTabela = (existeSt && thStAtual.includes('DESPESAS')) || (!existeSt && thStAtual.includes('ICMS ST'));

        if (existeSt) {
            blocoSt.style.display = 'block';
            blocoDespesas.style.display = 'none';
            document.getElementById('totalImposto').value = somaIcmsStTotal.toFixed(2);
            inputDespesas.value = '';
        } else {
            blocoSt.style.display = 'none';

            if (valorTotalNotaXML > 0 && Math.abs(valorTotalNotaXML - somaProdutosTotal) > 0.01) {
                blocoDespesas.style.display = 'block';
                let diferencaCalculada = valorTotalNotaXML - somaProdutosTotal;
                if (inputDespesas.value === '') {
                    inputDespesas.value = diferencaCalculada > 0 ? diferencaCalculada.toFixed(2) : '0.00';
                }
                despesasValor = parseFloat(inputDespesas.value) || 0;
                textoAviso.innerText = `* Valor gerado porque o valor total da nota (R$ ${formatarBR(valorTotalNotaXML)}) é diferente do valor total dos produtos (R$ ${formatarBR(somaProdutosTotal)}).`;
            } else if (inputDespesas.value !== '' && parseFloat(inputDespesas.value) > 0) {
                blocoDespesas.style.display = 'block';
                despesasValor = parseFloat(inputDespesas.value) || 0;
                textoAviso.innerText = `* Inserido manualmente para ratear encargos/despesas extras entre os itens.`;
            } else {
                blocoDespesas.style.display = 'none';
                inputDespesas.value = '';
            }
        }

        if (deveRecriarTabela) {
            construirTabela(false);
            return;
        }

        let despesasPorLinha = (qtdLinhasAtivas > 0) ? (despesasValor / qtdLinhasAtivas) : 0;

        for (let i = 1; i <= MAX_LINHAS; i++) {
            garantirLinhaExistente(i);
            let item = dadosProdutos[i];
            let estaAtiva = i <= qtdLinhasAtivas;

            let elParcelaDespesa = document.getElementById(`parcelaDespesa_${i}`);
            let elCustoTotalComImposto = document.getElementById(`custoTotalComImposto_${i}`);
            let elCustoFinal = document.getElementById(`custoFinal_${i}`);
            let elPrecoSel = document.getElementById(`precoSel_${i}`);

            if (!estaAtiva) {
                if (elParcelaDespesa) elParcelaDespesa.innerText = '0,00';
                if (elCustoTotalComImposto) elCustoTotalComImposto.innerText = 'R$ 0,00';
                if (elCustoFinal) elCustoFinal.innerText = 'R$ 0,00';
                if (elPrecoSel) elPrecoSel.innerText = 'R$ 0,00';
                continue;
            }

            let vTotalCaixa = parseFloat(item.valorTotal) || 0;
            let icmsSTItem = existeSt ? (parseFloat(item.icmsST) || 0) : 0;
            let acréscimoLinha = existeSt ? icmsSTItem : despesasPorLinha;
            let qLote = parseFloat(item.qtdLote) || 1;
            if (qLote <= 0) qLote = 1;

            if (elParcelaDespesa) elParcelaDespesa.innerText = formatarBR(despesasPorLinha);

            let custoTotalLinha = vTotalCaixa + acréscimoLinha;
            let custoUnitarioFinal = custoTotalLinha / qLote;

            if (elCustoTotalComImposto) elCustoTotalComImposto.innerText = `R$ ${formatarBR(custoTotalLinha)}`;
            if (elCustoFinal) elCustoFinal.innerText = `R$ ${formatarBR(custoUnitarioFinal)}`;

            let pct = 0;
            if (margemIndividual && item.margem !== '') {
                pct = parseFloat(item.margem) || 0;
            } else {
                if (margemSelecionada === 'custom') {
                    pct = parseFloat(document.getElementById('margemCustomInput').value) || 0;
                } else if (margemSelecionada !== null) {
                    pct = parseFloat(margemSelecionada) || 0;
                }
            }

            let precoVenda = custoUnitarioFinal * (1 + (pct / 100));
            if (elPrecoSel) elPrecoSel.innerText = `R$ ${formatarBR(precoVenda)}`;
        }
    }

    window.onload = () => construirTabela(false);
</script>
